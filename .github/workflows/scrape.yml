name: Scrape Admiralty NtM & NAVTEX (Every 6 Hours)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pypdf urllib3

      - name: Run 6-Hour Admiralty NtM, NAVTEX, Weather & SetNews Scraper
        run: |
          python scraper_github.py

      - name: Commit and Push updated data JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notices.json public/notices.json weather.json public/weather.json news.json public/news.json ais.json public/ais.json || true
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Auto-update Live Admiralty NtM, NAVTEX, Weather, SetNews & AIS ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # Prefer scraped files over concurrent main pushes (avoids rebase conflicts)
          git pull --rebase -X theirs origin main || {
            echo "Rebase conflicted — taking our scraped data"
            git checkout --theirs -- notices.json public/notices.json weather.json public/weather.json news.json public/news.json ais.json public/ais.json || true
            git add notices.json public/notices.json weather.json public/weather.json news.json public/news.json ais.json public/ais.json || true
            GIT_EDITOR=true git rebase --continue || true
          }
          for i in 1 2 3; do
            git push origin main && break
            echo "Push attempt $i failed — retry after fetch"
            git pull --rebase -X theirs origin main || true
            sleep 5
          done
