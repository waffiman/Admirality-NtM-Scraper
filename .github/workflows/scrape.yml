name: Scrape Admiralty NtM & NAVTEX (Every 6 Hours)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pypdf urllib3

      - name: Run 6-Hour Admiralty NtM, NAVTEX, Weather & SetNews Scraper
        run: |
          python scraper_github.py

      - name: Commit and Push updated data JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Include AIS snapshot — leaving it unstaged broke pull --rebase
          git add notices.json public/notices.json weather.json public/weather.json news.json public/news.json ais.json public/ais.json || true
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Auto-update Live Admiralty NtM, NAVTEX, Weather, SetNews & AIS ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase origin main
          git push origin main
