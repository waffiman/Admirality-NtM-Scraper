name: Admiralty NtM & Global NAVTEX Auto-Scraper (6h Cycle)

on:
  # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC) matching IMO GMDSS NAVTEX / SafetyNET broadcast cycles
  schedule:
    - cron: '0 */6 * * *'
  # Allow manual trigger anytime from GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Admiralty NtM & Global NAVTEX Scraper
        run: |
          python scraper_github.py

      - name: Commit and push if notices changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated UKHO NtM & Global NAVTEX/NAVAREA update [skip ci]"
          file_pattern: "public/notices.json notices.json"

      - name: Send Email Alert on Scraper Failure
        if: failure()
        run: |
          python -c '
          import urllib.request, json
          url = "https://formsubmit.co/ajax/wafficompany@gmail.com"
          payload = {
              "_subject": "🚨 ALERT: SetSail NtM Scraper Failed on GitHub Actions",
              "message": "The automated UKHO Admiralty Notices to Mariners scraper failed on GitHub Actions.\n\nRepository: waffiman/Admirality-NtM-Scraper\nWorkflow Run: https://github.com/waffiman/Admirality-NtM-Scraper/actions\n\nPlease inspect the workflow logs.",
              "_captcha": "false"
          }
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json", "Referer": "https://waffiman.github.io/Admirality-NtM-Scraper/"}
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  print("Failure alert email sent to wafficompany@gmail.com, HTTP:", r.status)
          except Exception as e:
              print("Alert email error:", e)
          '
